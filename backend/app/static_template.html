function pageTimeline(page) { const t = timeline(F, UI.timelineTop); const max = Math.max(0.0001, ...t.heatmap.flatMap((r) => r.cells.map((c) => c.rate || 0))); page.innerHTML = insightBox("timeline") + `<div class="kpis">${kpi("対象者 n", num(t.n), "", "g")}${kpi("表示カテゴリ数", `<input class="ctl" style="width:80px" type="number" min="3" max="40" value="${UI.timelineTop}" id="tlTop">`, "経験人数上位")}${kpi("基準日", "D−0", "非購入者の基準日は購入日ではない（定義未確認）")}${kpi("値の定義", "ユニーク人数÷n", "同一人物の同日複数行動は1人", "c")}</div>${card("カテゴリ × 日（D−n）ヒートマップ", "セル＝その日に当該行動を経験したユニーク人数÷n。ホバーで数値。", `<div style="overflow:auto"><table class="hm" style="border-collapse:collapse;font-size:10px"><thead><tr><th style="text-align:left;color:var(--n600);font-weight:700">カテゴリ</th>${t.days.map((d) => `<th>${d % 5 === 0 ? "D−" + d : ""}</th>`).join("")}</tr></thead><tbody>${t.heatmap.map((r) => `<tr><td style="white-space:nowrap;padding-right:8px">${esc(r.label)}</td>${r.cells.map((c) => `<td><div class="c" title="${esc(r.label)} D−${c.day}: ${num(c.count)}人 (${pct(c.rate)})" style="background:rgba(5,150,105,${(0.06 + 0.9 * (c.rate || 0) / max).toFixed(3)})"></div></td>`).join("")}</tr>`).join("")}</tbody></table></div>`, `<button class="btn" id="tlCsv">⬇ CSV</button>`)}<div class="mb">${card("時期別ランキング", "各ウィンドウ内に1回以上経験したユニーク人数÷n", `<div class="grid3">${t.window_rankings.map((w) => `<div><div class="section-label mb">${esc(w.window)}</div><table class="tbl">${w.rows.map((r) => `<tr><td>${esc(r.label)}</td><td class="num">${pct(r.rate)}</td></tr>`).join("")}</table></div>`).join("")}</div>`)}</div>${card("人の観測期間別の比較", "観測期間（日数）区分ごとの経験率（分母＝各区分の人数）", table([{ h: "行動", v: (r) => r.label }, ...t.duration_buckets.map((b) => ({ h: `${b.bucket}（n=${num(b.n)}）`, num: 1, v: (r) => r[b.bucket], r: (r) => pct(r[b.bucket]) }))], t.labels.map((lab) => ({ label: lab, ...Object.fromEntries(t.duration_buckets.map((b) => [b.bucket, b.rows.find((r) => r.label === lab)?.rate ?? null])) })), { exportName: "timeline_duration_buckets.csv" }))}${notes(["D−n は基準日からの日数（非購入者の基準日は購入日ではありません）。", "行動発生時期フィルタで隣接させたパスは「期間内抽出後の隣接」であり、元ログの真の連続パスとは異なります。"])}`; $("#tlTop").addEventListener("change", (e) => { UI.timelineTop = Math.min(40, Math.max(3, Number(e.target.value) || 3)); render(); }); $("#tlCsv").addEventListener("click", () => csv("timeline_heatmap.csv", ["行動", ...t.days.map((d) => "D-" + d)], t.heatmap.map((r) => [r.label, ...r.cells.map((c) => c.count)]), { filters: describe(F), n: t.n, 値: "ユニーク人数" })); }

function pageEntry(page) { const e = UI.entry; const names = observedLabels(F); const options = (F.granularity === "variable" && !F.show_repeat ? [WORRY] : []).concat(names); if (!options.includes(e.anchor)) e.anchor = [WORRY, "悩み・成分・カテゴリ検索", "悩み・成分・カテゴリ検索 1回目"].find((x) => options.includes(x)) ?? options[0]; const r = entry(F, { anchor: e.anchor, steps: e.steps, occurrence: e.occurrence, follow: e.follow, target: e.target, within: e.within }); const filtered = options.filter((o) => !e.query || o.toLowerCase().includes(e.query.toLowerCase())); const valRows = (D.validation?.rows || []).filter((x) => x.section.startsWith("追加集計：悩み検索起点") && ((F.age === "18-29" && x.segment.startsWith("18")) || (F.age === "30-49" && x.segment.startsWith("30")))); page.innerHTML = insightBox("entry", { anchor: e.anchor }) + `<div class="card filters">${field("起点（検索可・実マスタに存在する項目のみ）", `<div class="rowflex"><input class="ctl" style="width:150px" placeholder="絞り込み…" id="enQ" value="${esc(e.query)}"><select class="ctl" id="enAnchor" style="min-width:280px">${filtered.map((o) => `<option ${o === e.anchor ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`)}${field("ステップ数", seg("", String(e.steps), [2, 3, 4, 5, 6, 7, 8, 9, 10].map((s) => [String(s), String(s)]), (v) => { e.steps = Number(v); render(); }))}${field("起点の出現", seg("", e.occurrence, [["first", "初回出現"], ["last", "最終出現"], ["all", "全出現"]], (v) => { e.occurrence = v; render(); }))}${field("後続の定義", seg("", e.follow, [["next", "直後の行動"], ["next_in_category", "次に指定カテゴリが現れる行動"], ["within_days", "指定日数内の後続行動"]], (v) => { e.follow = v; render(); }))}${e.follow === "next_in_category" ? field("指定カテゴリ", `<select class="ctl" id="enTarget"><option value="">（未指定＝直後）</option>${D.cats.map((c) => `<option ${c === e.target ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>`) : ""}${e.follow === "within_days" ? field("日数以内", `<input class="ctl" style="width:64px" type="number" min="0" max="30" value="${e.within}" id="enWithin">`) : ""}</div><div class="kpis">${kpi("対象者 n", num(r.n))}${kpi("起点単体経験率", pct(r.anchor_rate), `${num(r.anchor_count)}人 ÷ n`, "g")}${kpi("起点イベント件数", num(r.anchor_events), e.occurrence === "all" ? "全出現（延べ）" : e.occurrence === "first" ? "初回出現のみ" : "最終出現のみ")}${kpi("2接点率の分母", num(r.anchor_count), "起点経験者", "c")}${kpi("完全パス経験率の分母", num(r.n), "フィルタ対象者数")}</div>${r.levels.map((lv) => card(`${lv.depth}接点パス（起点 → … → ${lv.depth}番目）`, lv.depth === 2 ? "条件付き率の分母＝起点経験者" : `条件付き率の分母＝${lv.depth - 1}番目までのパスを経験した人`, table([{ h: "パス", v: (x) => x.path.join(" → ") }, { h: "ユニーク人数", num: 1, v: (x) => x.count }, ...(e.occurrence === "all" ? [{ h: "イベント件数", num: 1, v: (x) => x.events }] : []), { h: "条件付き率", num: 1, v: (x) => x.rate_of_parent, r: (x) => `${pct(x.rate_of_parent)}（/${num(x.parent_count)}）` }, { h: "起点経験者内率", num: 1, v: (x) => x.rate_of_anchor, r: (x) => pct(x.rate_of_anchor) }, { h: "完全パス経験率（/n）", num: 1, v: (x) => x.rate_of_all, r: (x) => pct(x.rate_of_all) }, { h: `${lv.depth}番目の平均時期`, num: 1, v: (x) => x.avg_dn, r: (x) => dayF(x.avg_dn) }], lv.rows, { exportName: `entry_${lv.depth}.csv`, exportMeta: { anchor: e.anchor, filters: describe(F), n: r.n, anchor_count: r.anchor_count, occurrence: e.occurrence, follow: e.follow }, maxHeight: 360 }))).join("")}${notes(r.notes)}${e.anchor === WORRY && F.result === "buyer" && F.age !== "all" && valRows.length ? card("追加集計Excel（悩み系KW起点）との照合（生成時の結果）", "Excel値／再計算値／差分／分母／定義／不一致理由", table([{ h: "区分", v: (x) => x.section.replace("追加集計：", "") }, { h: "項目", v: (x) => x.item }, { h: "Excel値", num: 1, v: (x) => x.excel, r: (x) => pct(x.excel, 2) }, { h: "再計算値", num: 1, v: (x) => x.recalc, r: (x) => pct(x.recalc, 2) }, { h: "差分", num: 1, v: (x) => x.diff, r: (x) => x.diff === null ? "–" : (x.diff * 100).toFixed(2) + "pt" }, { h: "分母", num: 1, v: (x) => x.denominator }, { h: "定義", v: (x) => x.definition }, { h: "判定", r: (x) => x.match ? '<span class="chip ok">一致</span>' : '<span class="chip warn">不一致</span>' }, { h: "不一致理由", v: (x) => x.reason }], valRows, { exportName: "entry_validation.csv", maxHeight: 360 }) + '<div class="note mt">2接点は定義（初回出現の直後行動）が一致します。3接点はExcel側が率の積で算出された形跡があるため一致させず、差分理由を表示しています。</div>') : (e.anchor === WORRY ? '<div class="note mt">Excelとの照合は「結果＝購入者」かつ年代を指定した場合に表示されます。</div>' : "")}`; $("#enQ").addEventListener("change", (ev) => { e.query = ev.target.value; render(); }); $("#enAnchor").addEventListener("change", (ev) => { e.anchor = ev.target.value; render(); }); $("#enTarget")?.addEventListener("change", (ev) => { e.target = ev.target.value; render(); }); $("#enWithin")?.addEventListener("change", (ev) => { e.within = Math.max(0, Math.min(30, Number(ev.target.value) || 0)); render(); }); }

function pageSearch(page) { const s = UI.search; const names = observedLabels(F); const r = search(F, { start: s.start, end: s.end, via: s.via, min_steps: s.min_steps, max_steps: Math.max(s.min_steps, s.max_steps), min_count: s.min_count, sort: s.sort }); const opts = (v) => `<option value="">（指定なし）</option>${names.map((l) => `<option ${l === v ? "selected" : ""}>${esc(l)}</option>`).join("")}`; page.innerHTML = insightBox("search") + `<div class="card filters">${field("起点", `<select class="ctl" id="sStart" style="min-width:200px">${opts(s.start)}</select>`)}${field("終点", `<select class="ctl" id="sEnd" style="min-width:200px">${opts(s.end)}</select>`)}${field("経由（中間に含む）", `<div class="rowflex"><select class="ctl" id="sVia" style="min-width:180px"><option value="">追加…</option>${names.map((l) => `<option>${esc(l)}</option>`).join("")}</select>${s.via.map((v) => `<span class="chip neutral" data-v="${esc(v)}" style="cursor:pointer">${esc(v)} ×</span>`).join("")}</div>`)}${field("ステップ数", `<div class="rowflex"><input class="ctl" style="width:56px" type="number" min="2" max="10" value="${s.min_steps}" id="sMin"> 〜 <input class="ctl" style="width:56px" type="number" min="2" max="10" value="${s.max_steps}" id="sMax"></div>`)}${field("最小人数", `<input class="ctl" style="width:64px" type="number" min="0" value="${s.min_count}" id="sCount">`)}${field("並び順", seg("", s.sort, [["count", "人数"], ["rate", "経験率"], ["diff_pt", "差pt"], ["ratio", "倍率"], ["buyer_rate", "購入者率"]], (v) => { s.sort = v; render(); }))}<button class="btn primary" id="sGo">検索</button></div><div class="kpis">${kpi("対象者 n", num(r.n))}${kpi("該当パス数", num(r.total_matches), "上位200件表示", "g")}${kpi("購入者 n／非購入者 n", `${num(r.buyer_n)}／${num(r.nonbuyer_n)}`, "同条件（年代・期間）での分母", "c")}${kpi("パス定義", F.path_mode === "consecutive" ? "連続パス" : "順序保持パス", F.path_mode === "consecutive" ? "隣接遷移のみ" : "間に他行動を許容（初回出現ベース）")}</div><div style="display:grid;grid-template-columns:${s.selected ? "3fr 2fr" : "1fr"};gap:12px">${card("検索結果", "経験率の分母＝n。購入者率／非購入者率の分母は同条件の購入者／非購入者。", table([{ h: "パス", v: (x) => x.path_str }, { h: "ステップ", num: 1, v: (x) => x.steps }, { h: "人数", num: 1, v: (x) => x.count }, { h: "経験率", num: 1, v: (x) => x.rate, r: (x) => pct(x.rate) }, { h: "購入者率", num: 1, v: (x) => x.buyer_rate, r: (x) => `${pct(x.buyer_rate)} (${num(x.buyer_count)})` }, { h: "非購入者率", num: 1, v: (x) => x.nonbuyer_rate, r: (x) => `${pct(x.nonbuyer_rate)} (${num(x.nonbuyer_count)})` }, { h: "差pt", num: 1, v: (x) => x.diff_pt, r: (x) => pt(x.diff_pt) }, { h: "倍率", num: 1, v: (x) => x.ratio, r: (x) => ratioF(x.ratio) }, { h: "平均期間", num: 1, v: (x) => x.avg_duration, r: (x) => num(x.avg_duration, 1) + "日" }, { h: "平均行動数", num: 1, v: (x) => x.avg_action_count, r: (x) => num(x.avg_action_count, 1) }, { h: "", r: (x) => small(x.small_cell) }], r.rows, { exportName: "path_search.csv", exportMeta: { filters: describe(F), n: r.n, buyer_n: r.buyer_n, nonbuyer_n: r.nonbuyer_n, start: s.start, end: s.end, via: s.via.join("|") }, maxHeight: 620, pageSize: 50, rowKey: (x) => x.path_str, selectedKey: s.selected, onClick: (x) => { s.selected = x.path_str; s.selectedPath = x.path; render(); } }) + `<div class="mt">${notes(r.notes)}</div>`)}${s.selected ? card("パス詳細", esc(s.selected), (() => { const d = detail(F, s.selectedPath); return `<div class="kpis" style="grid-template-columns:1fr 1fr">${kpi("経験者（ユニーク）", `${num(d.count)}人`, `${pct(d.rate)}（/n=${num(d.n)}）`, "g")}${kpi("平均期間／平均行動数", `${num(d.avg_duration, 1)}日／${num(d.avg_action_count, 1)}`)}</div><div class="section-label mb">ステップ別発生時期（初回一致位置）</div><table class="tbl mb">${d.step_timing.map((x) => `<tr><td>${x.step}. ${esc(x.label)}</td><td class="num">${dayF(x.avg_dn)}</td><td class="num">${num(x.n)}人</td></tr>`).join("")}</table><div class="section-label mb">セグメント比較（各セグメントの分母で再計算）</div><table class="tbl mb">${d.segments.map((x) => `<tr><td>${esc(x.segment)}</td><td class="num">${num(x.count)}／${num(x.n)}</td><td class="num">${pct(x.rate)}</td></tr>`).join("")}</table><div class="section-label mb">匿名の実行動例（カテゴリ変換前後）</div><div style="max-height:420px;overflow:auto">${d.examples.map((ex) => `<div class="ex"><div style="font-weight:700">${esc(ex.person)}｜${esc(ex.age_group)}・${esc(ex.purchase_status)}・${ex.duration_days}日・${ex.action_count}行動</div><ol>${ex.sequence.map((q, i) => `<li class="${ex.matched_positions && ex.matched_positions.includes(i) ? "hit" : ""}"><span class="st">${q.step}.</span><span class="dn">D−${q.dn}</span><span>${esc(q.variable)}<span style="color:var(--n500)">（${q.repeat}回目）</span></span><span class="lb">${esc(q.label)}</span></li>`).join("")}</ol></div>`).join("")}</div>`; })(), '<button class="btn" id="toGp">Golden Pathでハイライト</button>') : ""}</div>`; const upd = () => { s.start = $("#sStart").value; s.end = $("#sEnd").value; s.min_steps = Math.max(2, Math.min(10, Number($("#sMin").value) || 2)); s.max_steps = Math.max(2, Math.min(10, Number($("#sMax").value) || 2)); s.min_count = Math.max(0, Number($("#sCount").value) || 0); }; $("#sGo").addEventListener("click", () => { upd(); render(); }); $("#sVia").addEventListener("change", (ev) => { upd(); if (ev.target.value && !s.via.includes(ev.target.value)) s.via.push(ev.target.value); render(); }); page.querySelectorAll(".chip[data-v]").forEach((el) => el.addEventListener("click", () => { upd(); s.via = s.via.filter((x) => x !== el.dataset.v); render(); })); $("#toGp")?.addEventListener("click", () => { UI.highlight = s.selectedPath; UI.selNodes = []; UI.selEdges = []; G.mode = "anchor"; G.anchor = s.selectedPath[0]; G.steps = Math.max(s.selectedPath.length, 3); saveState(); location.hash = "#golden-path"; }); }

render();
</script>
</body>
